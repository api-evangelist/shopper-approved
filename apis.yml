aid: shopper-approved
name: Shopper Approved
description: >-
  Shopper Approved is an e-commerce ratings and reviews platform that helps merchants collect, manage, and display
  verified customer reviews to improve conversion rates and build trust. The platform powers Google Seller Ratings,
  enabling reviews to appear in Google Shopping ads and organic search results. Shopper Approved offers a REST API for
  programmatic access to review data, order submission for review collection, product review management, and site
  statistics.
